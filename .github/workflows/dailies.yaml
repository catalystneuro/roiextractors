name: Daily Workflows

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * *"  # Daily at 10am EST

jobs:
    load_python_and_os_versions:
        runs-on: ubuntu-latest
        outputs:
            ALL_PYTHON_VERSIONS: ${{ steps.load_python_versions.outputs.python_versions }}
            ALL_OS_VERSIONS: ${{ steps.load_os_versions.outputs.os_versions }}
        steps:
            - uses: actions/checkout@v6
            - id: load_python_versions
              run: |
                MINIMUM=$(cat ./.github/workflows/min_python_version.txt)
                MAXIMUM=$(cat ./.github/workflows/max_python_version.txt)
                echo "python_versions=[\"$MINIMUM\", \"$MAXIMUM\"]" >> "$GITHUB_OUTPUT"
            - id: load_os_versions
              run: echo "os_versions=$(cat ./.github/workflows/all_os_versions.txt)" >> "$GITHUB_OUTPUT"

    run-tests:
        needs: load_python_and_os_versions
        uses: ./.github/workflows/run-tests.yml
        secrets:
            AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            S3_GIN_BUCKET: ${{ secrets.S3_GIN_BUCKET }}
            CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
            python-versions: ${{ needs.load_python_and_os_versions.outputs.ALL_PYTHON_VERSIONS }}
            os-versions: ${{ needs.load_python_and_os_versions.outputs.ALL_OS_VERSIONS }}

    notify:
        runs-on: ubuntu-latest
        needs: run-tests
        if: ${{ always() && contains(needs.*.result, 'failure') }}
        steps:
        - uses: dawidd6/action-send-mail@v3
          with:
            server_address: smtp.gmail.com
            server_port: 465  # TSL
            username: ${{ secrets.MAIL_USERNAME }}
            password: ${{ secrets.MAIL_PASSWORD }}
            subject: ROIExtractors Daily Failure
            to: ${{ secrets.DAILY_FAILURE_EMAIL_LIST }}  # add more with commas, no separation
            from: ROIExtractors
            body: "The daily workflow for ROIExtractors failed: please check status at https://github.com/catalystneuro/roiextractors/actions/workflows/dailies.yaml"
